name: Build, Scan & Push to GHCR

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:latest

      - name: Run Trivy Vulnerability Scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --ignore-unfixed \
            ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          echo "Pushing image to ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}..."
          if ! docker push ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}; then
            echo "::error::Push failed. Ensure GitHub Actions has write access in: Repository Settings -> Actions -> General -> Workflow permissions -> Select 'Read and write permissions'."
            exit 1
          fi
          docker push ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:latest
