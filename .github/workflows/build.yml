name: Build, Scan & Push to GHCR

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:latest
