name: Tests & Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest (Unit & Manifest Tests)
        env:
          PYTHONPATH: backend
        run: |
          pytest -v backend/tests/test_detector.py backend/tests/test_templates.py backend/tests/test_registry.py backend/tests/test_kubernetes.py
